services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  game-server-1:
    build: .
    ports:
      - "4001:4000"
    environment:
      SERVER_PORT: 4000
      SERVER_ID: game-server-1
      SERVER_PUBLIC_URL: ws://localhost:4001
      MAX_ROOMS_PER_SERVER: 100
      REDIS_URL: redis://redis:6379
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DYNAMODB_ROOMS_TABLE: ${DYNAMODB_ROOMS_TABLE}
      DYNAMODB_PLAYERS_TABLE: ${DYNAMODB_PLAYERS_TABLE}
      DYNAMODB_GAMELOG_TABLE: ${DYNAMODB_GAMELOG_TABLE}
      DYNAMODB_ENEMIES_TABLE: ${DYNAMODB_ENEMIES_TABLE}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy

  game-server-2:
    build: .
    ports:
      - "4002:4000"
    environment:
      SERVER_PORT: 4000
      SERVER_ID: game-server-2
      SERVER_PUBLIC_URL: ws://localhost:4002
      MAX_ROOMS_PER_SERVER: 100
      REDIS_URL: redis://redis:6379
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      DYNAMODB_ROOMS_TABLE: ${DYNAMODB_ROOMS_TABLE}
      DYNAMODB_PLAYERS_TABLE: ${DYNAMODB_PLAYERS_TABLE}
      DYNAMODB_GAMELOG_TABLE: ${DYNAMODB_GAMELOG_TABLE}
      DYNAMODB_ENEMIES_TABLE: ${DYNAMODB_ENEMIES_TABLE}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      redis:
        condition: service_healthy
